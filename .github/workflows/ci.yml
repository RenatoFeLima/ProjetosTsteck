name: CI

# A Vercel compila com Root Directory = web, então o CI também roda dentro de
# /web — a única fonte que chega em produção. Ver README ("Estrutura do repo").

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Guard — fonte de produção íntegra (/web)
        run: npm run check:production-root

      - name: Prisma generate
        run: npx prisma generate

      # Lint informativo (não bloqueia): há dívida técnica de lint pré-existente
      # que não impede o build de produção. Remover o continue-on-error quando zerada.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Tests
        run: npm test

      # DATABASE_URL fake só para o `next build` (não conecta no banco real).
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: "mysql://ci:ci@localhost:3306/ci"
